        可分组维度=pay_bank_code/pay_bank_name（代理银行）、rec_bank_name（收款银行）、bustype（业务类型）、pay_date（缴款日）、
        is_received（到账）；执收单位/科目/项目/归属区划分组用 paybook_full_high_item 明细行口径（非税缴款金额/清分金额）；同 fpaycode 各明细行的票面总额与书级属性组内全等，
