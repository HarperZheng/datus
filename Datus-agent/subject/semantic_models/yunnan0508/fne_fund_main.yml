  - name: entered_uncleared_paybook
    source: SELECT pay_code, SUM(fimamt) AS uncleared_amt, MAX(pay_date) AS pay_date
      FROM (SELECT DISTINCT p.fid AS fid, p.fpaycode AS pay_code, p.fimamt AS fimamt,
      toDate(nullIf(p.fdate, '')) AS pay_date FROM yunnan0508.fne_paybook_full_high
      p JOIN yunnan0508.fne_funddivide_transfer fd ON fd.fpaybooksubid = p.fid JOIN
      yunnan0508.fne_treasury_transfer_new t ON t.fpid = fd.fid WHERE t.fenterstatus
      = '1' AND p.fcollectid = '') GROUP BY pay_code
    description: 已缴入国库未完成清分池（异常存在性校验）：宽表 fcollectid=''（未汇总入清分批次，
      ClearDetail.xml:156/221）经两跳（funddivide_transfer.fpaybooksubid=宽表 fid → treasury_transfer_new.fpid=funddivide
      fid，t.fenterstatus='1'）判定已缴库
    ai_context:
      instructions: 数据集自包含（两跳判定在 source SQL 内），不与其他 dataset 建关系；关联路径：两跳（fd.fpaybooksubid=p.fid
        JOIN t.fpid=fd.fid），禁用 ftransno 直连清分表（须经 fcollectid→ftranscollectid→ftransno 三跳）；
        判定组合：已缴入国库=t.fenterstatus='1' AND 未清分=宽表 fcollectid=''（CH 23.3 join_use_nulls=0 空串语义，
        null=未汇总/'0'=汇总中/非空=已汇总；fispayenter 是缴库侧标志非清分完成标志，勿用）；inner DISTINCT（fid 粒度）防两跳
        扇出，外层按 fpaycode 聚合明细行 fimamt；子查询列必须显式 AS 别名（CK 23.3 DISTINCT+JOIN 下裸 p.fimamt 输出名被改写致外层
        Missing columns 'fimamt'，且 fd 表也有同名列 fimamt）
    fields:
    - name: pay_code
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: pay_code
      label: 票据关联码
      description: 缴款码（池聚合键，每 fpaycode 一行），未清分笔数口径 COUNT(DISTINCT pay_code)
