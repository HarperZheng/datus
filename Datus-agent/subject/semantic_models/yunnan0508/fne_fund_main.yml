  - name: dim_agen
    source: SELECT fagenidcode, fagencode, fagenname, flevel, ftypecode, fpidcode,
      toString(fisleaf) AS fisleaf FROM (SELECT fagenidcode, fagencode, fagenname,
      flevel, ftypecode, fpidcode, toString(fisleaf) AS fisleaf, ROW_NUMBER() OVER
      (PARTITION BY fagenidcode ORDER BY fupdatetime DESC) AS _rn FROM yunnan0508.fab_agen)
      WHERE _rn = 1
    description: 执收单位查询型维度：fab_agen 按 fagenidcode 去重取最新版本（fupdatetime DESC）；含 parent_agen/is_leaf 单位树层级钻取字段
    ai_context:
      instructions: fab_agen 原始行含多版本，直连会扇出，必须使用本去重数据集；与事实表的边（fchgagenidcode=fagenidcode）实测验证连接，to
        侧去重后唯一；去重实现说明：规格原文为 ORDER BY fupdatetime DESC LIMIT 1 BY fagenidcode，因引擎查询源解析器不支持
        LIMIT 1 BY，已等价改写为 ROW_NUMBER() OVER (PARTITION BY fagenidcode ORDER BY fupdatetime
        DESC)=1（多列去重单排序列技巧）；parent_agen 指向表内 fagenidcode，可按 parent_agen=单位ID
        自联结汇总子单位缴款（注意少数单位存在跨版本父编码漂移，见 parent_agen 字段说明）
