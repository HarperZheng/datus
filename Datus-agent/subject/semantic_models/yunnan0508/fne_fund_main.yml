version: 0.2.0.dev0
semantic_model:
- name: fne_fund_main
  description: 非税收入资金链（缴款→清分→划拨→缴库）：核心骨架（paybook_full_high / funddivide_transfer /
    treasury_transfer_dedup）+ 同主题补充（transfer_new / agen_treasury_high）+ 查询型维度（dim_agen
    / dim_subject），共 7 个 dataset、9 条实测验证关系（R1-R4 主链 + D5-D9 维度）
  ai_context:
    instructions: 金额指标一律锚定单 dataset（跨边求和会因 M:N 扇出膨胀）；测试环境放宽规则允许 to 侧非唯一的关系用于行级钻取，预期基数已写入各关系
      ai_context；生产化时按 28 号标准 §七 复验升级；fbustype（业务类型：1=直缴、2=汇缴）仅存在于 paybook_full_high
      数据集，仅缴款/清分/清分率类指标可按业务类型切片，禁止对其他 dataset（funddivide_transfer / treasury_transfer_dedup
      / transfer_new / agen_treasury_high）的指标按业务类型分组或过滤
  datasets:
  - name: paybook_full_high
    source: yunnan0508.fne_paybook_full_high
    description: 缴款书全生命周期宽表（缴款+清分事实，PAYBOOK+ITEM+状态），1,272 行，明细行粒度
    ai_context:
      instructions: 分析缴款/清分/归属/科目/项目层级用；金额可直 SUM，笔数键统一 COUNT(DISTINCT fpaycode)（2026-10-26 round-02
        全局拍板5：笔数键统一 fpaycode；全表 1,281 行 fid distinct 1,110 / fpaycode distinct 975，fid 有生命周期多版本重复、fpaycode
        因明细拆多行亦非唯一，两者计数都必须去重）；主时间轴 pay_date=toDate(nullIf(fdate,''))（缴款日，day 粒度；2026-10-26 round-02 全局拍板1：缴款时间统一 FDATE，
        toDate 精度不带时分秒；原主时间轴 fill_date 开票日降级为分析维度）；与汇缴（une_）口径不混算；R1 边（被 funddivide_transfer.fpaybooksubid
        引用）实测 JOIN 1,130 行；fbustype：1=直缴、2=汇缴，表内混合存在（全表实测 1=1,063 行/2=209 行）；凡用户提及"直缴"必须按
        fbustype='1' 收窄，禁止将全表 SUM(famt) 表述为直缴金额；日期维度体系：除主时间轴 pay_date 外已建模日期维度（开票日 fill_date、
        有效期 eff_date、资金到账 received_date、划转 trans_date、划拨到账 enter_date），仅作分析维度；"缴款/今年缴款"类问题一律按主时间轴
        pay_date 过滤，开票口径需显式改用 fill_date（差异见字段说明）；欠缴/未缴款口径=缴款书状态 fstate='1'（round-02 q22 拍板，禁用
        is_received='0' 表述欠缴），未缴时长分档用 unpaid_duration_bucket 维度，未缴笔数口径 COUNT(DISTINCT fpaycode)（全局拍板5）
    fields:
    - name: fid
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fid
      label: 缴款明细ID
      description: 缴款明细生命周期ID；存在生命周期多版本重复，非唯一键；2026-10-26 round-02 全局拍板5 后笔数口径统一走 fpaycode（见
        pay_code 字段），本字段仅作行标识与 R1/R4 连接键
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","is_dimension":false}'
    - name: fpid
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fpid
      label: 缴款主单ID
      description: 缴款通知书主单ID，同主单可有多明细行
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","is_dimension":false}'
    - name: famt
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: famt
      label: 缴款金额
      description: 缴款通知书明细金额（元）
      datatype: Decimal
    - name: fimamt
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fimamt
      label: 清分金额
      description: 该明细行已清分金额（元）
      datatype: Decimal
    - name: fill_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(ffilldate)
      dimension:
        is_time: true
      label: 缴款通知书填开日
      description: 缴款通知书填开日期（ffilldate 字符串转 Date），开票口径分析维度；2026-10-26 round-02 全局拍板1 后主时间轴已切至
        pay_date（缴款日），本字段降级仅作开票口径分析维度（"按开票日"类问题显式使用）
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
    - name: fchgagenidcode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fchgagenidcode
      label: 执收单位ID
      description: 执收单位唯一编码，连接 dim_agen.fagenidcode
    - name: fchgagenname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fchgagenname
      label: 执收单位名称
      description: 执收单位名称（内联）
      ai_context:
        synonyms:
        - 执收单位
    - name: fchgrgncode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fchgrgncode
      label: 执收单位区划代码
      description: 执收单位所在区划代码
    - name: fchgrgnname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fchgrgnname
      label: 执收区划名称
      description: 执收单位所在区划名称（内联），String 型；实测 1,272 行 100% 非空，5 个 distinct 全分布：云南省本级 1,242 行/昆明市本级
        17/五华区 7/官渡区 4/云龙县 2；与 fchgrgncode 一一对应，分组展示优先用本列；与归属区划 frecrgnname 实测 584 行不一致（区划间资金流入口径的近似基础；注意
        frecrgnname 含空串与"中央"等特殊值，跨区归因口径需业务确认）
      ai_context:
        synonyms:
        - 执收区划
    - name: frecrgnname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: frecrgnname
      label: 归属区划名称
      description: 资金归属区划名称（内联，州市/区县）
      ai_context:
        synonyms:
        - 州市
        - 区县
        - 区划
    - name: frecrgncode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: frecrgncode
      label: 归属区划代码
      description: 资金归属区划代码
    - name: frecbankname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: frecbankname
      label: 收款银行名称
      description: 缴款资金收款银行名称（内联），String 型；实测 1,272 行 100% 非空，9 个 distinct（trim 后仍 9 个，取值统一带尾部空格，过滤匹配时注意）：
        中国建设银行 923 行/中国工商银行 125/中国银行 117/人民银行 80/中国邮政储蓄银行 14/中国农业银行 9/云南省农村信用社联合社 2/支付宝 1/中国光大银行 1；"各代理银行收入"
        场景按本列分组；编码 frecbankcode 与 fpf_bank 维度表按 07 编码让位名称规则暂不建（出现按编码对齐需求时再建）
      ai_context:
        synonyms:
        - 收款银行
        - 代理银行
        - 银行
    - name: fsubcode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fsubcode
      label: 科目代码
      description: 预算科目代码，连接 dim_subject.fsubcode
    - name: fsubname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fsubname
      label: 科目名称
      description: 预算科目名称（内联）
    - name: fitemidcode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fitemidcode
      label: 项目ID
      description: 非税收入项目ID
    - name: fitemname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fitemname
      label: 项目名称
      description: 非税收入项目名称（内联）
    - name: fcollectid
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fcollectid
      label: 汇总批次ID
      description: 清分汇总批次ID；空串表示尚未入批次
    - name: fistransfer
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fistransfer
      label: 划拨标志
      description: 是否已划拨：1=已划拨
    - name: fstate
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fstate
      label: 缴款书状态
      description: 缴款书生命周期状态，String 型，过滤值必须带引号；码值枚举（源码 UPayBook.xml：1=未缴款、2=作废、3=已缴款、4=已到账）；
        实测分布（1,281 行）：'3'=1266 行（主导状态）、''（空）=13 行、'2'=1 行、'1'=1 行；注意 3 是主导但非唯一状态，过滤/分组时保留空串与其他码值的可能性；
        round-02 q22 拍板：欠缴/已开具未缴款=本字段='1'（源侧另配 fne_paybook 按 fpaycode 左连无记录兜底，宽表内以本字段为准），未缴笔数口径
        COUNT(DISTINCT fpaycode)（2026-10-26 全局拍板5 笔数键统一 fpaycode），未缴时长分档用 unpaid_duration_bucket
      ai_context:
        synonyms:
        - 缴款状态
        - 未缴款
        - 欠缴
        - 已缴款
    - name: fbustype
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fbustype
      label: 业务类型
      description: 缴款业务类型：1=直缴，2=汇缴（集中汇缴，fne_ 表内混合存在）；String 型，
        过滤值必须带引号；用户问"直缴/汇缴"必须按本字段切片或过滤，禁止把全表 SUM 当直缴
      ai_context:
        synonyms:
        - 业务类型
        - 缴款方式
        - 直缴
        - 汇缴
    - name: funds_nature
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high.ffundsnaturecode
      label: 资金性质
      description: 资金性质（预算级次）码，String 型，过滤值必须带引号；100% 非空；实测码值（全表 1,272 行口径）：12=政府性基金预算收入
        1,083 行/183.16 亿元（金额占比约 99.9%）、11=一般公共预算收入 97 行、2=财政专户管理资金 86 行、5=其他 6 行；直缴切片（fbustype='1'，1,063
        行）分布为 12=895 行/160.47 亿元、11=84 行、2=78 行、5=6 行；与 funddivide_transfer.funds_nature（frecfundsnaturecode）同码表
      ai_context:
        synonyms:
        - 资金性质
        - 预算级次
        - 基金
        - 一般公共预算
    - name: funds_nature_name
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high.ffundsnaturename
      label: 资金性质名称
      description: 资金性质中文名称（内联展示列），与 funds_nature（ffundsnaturecode）一一对应，取值：政府性基金预算收入/一般公共预算收入/财政专户管理资金/其他；分组展示优先用本列，过滤按码列
        funds_nature
    - name: income_sort
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high.fincomesortname
      label: 收入分类
      description: 收入分类名称（单列即名称，无配套码列）；实测分布：政府性基金收入 1,006 行/182.85 亿元、专项收入 142 行、行政事业性收费收入
        109 行、罚没收入 9 行、空 6 行
      ai_context:
        synonyms:
        - 收入分类
        - 收入类别
        - 罚没
        - 专项收入
    - name: pay_code
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high.fpaycode
      label: 票据关联码
      description: 财政票据关联码（缴款码），String 型；100% 非空，1,281 行共 975 个 distinct（2026-10-26 复测）；票据链（une_cbill_high.fpaycode）与资金链之间唯一验证连通的键（fpid
        跨链实测 0 行命中）；2026-10-26 round-02 全局拍板5：全部缴款类笔数指标（缴款/完成/未缴/分档）统一以本字段去重计数；为
        fne_bill_link.yml 票据-资金桥接模型预铺桥键，本文件内不声明关系
      ai_context:
        synonyms:
        - 票据关联
        - 缴款码
    - name: payer_name
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high.fpayername
      label: 缴款人（付款方）
      description: 缴款人/付款方名称（内联），String 型；实测 1,268/1,281 行非空、449 个 distinct（Top：测试单位 209 行、云南发展改革委员会
        57 行、李思维 47 行、hm 35 行、博思软件 32 行）；缴款人排名类问题（如 Top10 缴款人）按本列分组（round-02 q14 拍板）；账号类字段
        fpayerno/fpayerid 按拍板不建模
      ai_context:
        synonyms:
        - 缴款人
        - 付款方
        - 缴款单位
        - 缴款人名称
    - name: is_cleared
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high.fisclear
      label: 是否清分
      description: 是否已清分标志（物理 fisclear 为 Nullable(UInt32)，实测值域仅 0/1 无 NULL）：1=已清分 757 行、0=未清分 515 行；"未清分"
        过滤字段；清分环节与对账无关（round-02 q27 拍板：对账判定在缴库报文表 reconcile_status，禁止把本字段当"对账"落点）；欠缴/未缴款口径见
        fstate（round-02 q22 拍板）
      datatype: Integer
      ai_context:
        synonyms:
        - 清分状态
        - 已清分
        - 未清分
    - name: is_received
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high.fisreceived
      label: 资金是否到账
      description: 资金是否到账标志（物理 fisreceived 为 Nullable(UInt32)，实测值域仅 0/1 无 NULL）：1=已到账 874 行、0=未到账 398
        行（其中填开日 2025 年 36 行）；到账环节标志（比缴款晚一环，源码 UPayBook.xml），0 含"已缴款未到账"中间态——不等于欠缴，round-02 q22
        拍板：欠缴/未缴款=缴款书状态 fstate='1'，禁用 is_received='0' 表述欠缴；"未到账"过滤仍可用本字段
      datatype: Integer
      ai_context:
        synonyms:
        - 到账状态
        - 已到账
        - 未到账
    - name: clear_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(nullIf(paybook_full_high.fcleardate, ''))
      dimension:
        is_time: true
      label: 清分日期
      description: 清分日期（fcleardate 字符串转 Date，nullIf 空串守卫——空串直接 toDate 在 CH 23.3 抛 CANNOT_PARSE_DATE），本表二级时间轴
        （主时间轴为 pay_date，round-02 q16 拍板清分日期双侧时间轴对齐）；实测 760/1,281 行非空（521 行空串转 NULL）；清分时效分析用（clear_date -
        fill_date 间隔），未清分行此值为 NULL
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
    - name: eff_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(nullIf(paybook_full_high.feffdate, ''))
      dimension:
        is_time: true
      label: 缴款书有效期
      description: 缴款书有效期（feffdate 字符串转 Date，nullIf 空串守卫），NOT NULL，实测 1,281 行 100% 非空，范围 2022-03-21~2028-09-02（含未来
        日期，有效期天然可晚于当前）；判断已过期按本字段与当前日期比较，不能当业务发生时间轴用
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
      ai_context:
        synonyms:
        - 有效期
    - name: pay_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(nullIf(paybook_full_high.fdate, ''))
      dimension:
        is_time: true
      label: 缴款日期
      description: 缴款书缴款日期（fdate 字符串转 Date，nullIf 空串守卫），本表主时间轴（2026-10-26 round-02 全局拍板1：缴款时间统一 FDATE，
        toDate 精度不带时分秒），NOT NULL，实测 1,281 行 100% 非空，范围 2021-12-21~2026-10-07；与开票日 fill_date 实测 1,220 行同日、
        61 行晚于开票日、0 行早于开票日——"缴款/今年缴款"类问题一律按本字段过滤/分组，开票口径需显式改用 fill_date；源侧 fdate 另承载生成日期义
        （文档 150 号字段映射），本表主语义取缴款日期；文档 170 号缴款日期 fpaydate 列在本物理表不存在，无法建模
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
      ai_context:
        synonyms:
        - 缴款日
    - name: received_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(nullIf(paybook_full_high.freceiveddate, ''))
      dimension:
        is_time: true
      label: 资金到账日期
      description: 缴款资金到账日期（freceiveddate 字符串转 Date，nullIf 空串守卫），实测 869/1,281 行非空（412 行空串转 NULL，以未到账行为主），范围
        2022-01-07~2026-08-05；与 is_received（fisreceived）标志配套，实测轻微错位（日期有值但标志为 0 的 2 行、标志为 1 但日期为空的 7 行）——到账口径
        过滤以 is_received 为准（欠缴/未缴款口径见 fstate，round-02 q22 拍板），本字段用于到账时效（received_date 与 fill_date/pay_date 的间隔）；
        与 enter_date（划拨侧到账）是两条不同资金链，勿混用
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
      ai_context:
        synonyms:
        - 资金到账
        - 收款到账
    - name: trans_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(nullIf(paybook_full_high.ftransdate, ''))
      dimension:
        is_time: true
      label: 划转日期
      description: 划转/扣款日期（ftransdate 字符串转 Date，nullIf 空串守卫），源侧一列两义（划拨表 FTRANSDATE=划转日期、扣款表 FTRANSDATE=扣款日期
        映射同列），本表主语义取划转日期；实测近全空：仅 2/1,281 行有值（2024-08-29、2024-11-07），当前测试数据下划拨日期基本未回填，时效分析不可用
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
      ai_context:
        synonyms:
        - 划拨日期
