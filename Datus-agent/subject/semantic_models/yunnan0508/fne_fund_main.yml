  - name: treasury_transfer_dedup
    source: SELECT * FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY fid) AS _rn FROM
      yunnan0508.fne_treasury_transfer_new) WHERE _rn = 1
    description: 缴库报文去重数据集：fne_treasury_transfer_new 按 fid 去重（去除生命周期冗余报文）
    ai_context:
      instructions: 物理表含大量生命周期冗余报文（同一 fid 多行），本数据集按 fid 去重；缴库金额必须以本去重口径直
        SUM，直接 SUM 原始表会大幅虚增；ftranscollectid 引用 funddivide_transfer.fcollectid、fpid 引用 funddivide_transfer.fid
        （to 侧非唯一，授权行级钻取）；主时间轴
        msg_date=toDate(fmsgdate)，day 粒度；去重实现说明：规格原文为 LIMIT 1 BY fid（ClickHouse 方言扩展），因引擎查询源解析器不支持该语法，已等价改写为
        ROW_NUMBER() OVER (PARTITION BY fid)=1；"已缴入国库"口径=enter_status='1'（时间锚 enter_date，
        fincomestatus 属国库收入记账层不参与该口径，已缴入国库金额指标已内置过滤）；异常存在性校验
        两层：对账层 reconcile_status='1' 且 enter_status!='1'、记账层 income_status='1' 且 enter_status!='1'，指标 ftransno 去重笔数+单号明细，
        异常类型（对账/记账）为查询层组合维度
