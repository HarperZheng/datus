  - name: funddivide_transfer
    source: yunnan0508.fne_funddivide_transfer
    description: 汇总划拨批次宽表（清分→划拨环节）
    ai_context:
      instructions: 汇总划拨批次明细；金额可直 SUM；fcollectid 生命周期多版本非唯一（to 侧非唯一的关系授权行级钻取，金额指标一律锚定单
        dataset 不做跨边求和）；fpaybooksubid 引用 paybook_full_high_item.fid，fcollectid 被 transfer_new.fcollectid 引用；划拨完成/未划拨用 fistransfer='1'/'!=1' 收窄；
        空键口径：空串 fcollectid=尚未汇总入批次的清分明细行，承载几乎全部清分金额 fimamt，单表金额聚合禁止按
        fcollectid != '' 过滤（否则清分金额大幅坍缩）；ftransamt 空键行全 NULL（划拨金额全部在非空键行）；
        fpaybooksubid 无空键；已声明边 to 侧无空键，跨已声明边
        JOIN 无需空键前置；若未来连 fcollectid 两侧均有空键的未建模表（如 fne_funddivide_new），JOIN 两侧必须前置 fcollectid != ''；主时间轴 cleardate=toDate(fcleardate)，day 粒度
