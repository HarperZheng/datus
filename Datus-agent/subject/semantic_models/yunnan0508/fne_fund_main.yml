          expression: ftypecode
      label: 单位类型代码
      description: 单位类型编码
    - name: parent_agen
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fpidcode
      label: 上级单位编码
      description: 上级单位编码（物理 fpidcode），String 型，沿 parent_agen=fagenidcode 自联结构成单位树。
        父编码全部指向表内有效 fagenidcode（无悬挂）；少数单位存在跨版本父编码漂移（同键多版本 fpidcode 不同），
        去重取 fupdatetime 最新版后树可能受影响；典型用法：JOIN 子查询沿 parent_agen 汇总子单位
      ai_context:
