      instructions: 数据集自包含（join+聚合在 source SQL 内），不与其他 dataset 建关系，无扇出；落点缘起：fne_treasury_transfer_new.fpaycode
        实测 505 行全空串，无法直连宽表，必须经 funddivide_transfer 两跳链（t.fpid=fd.fid 与 t.ftranscollectid=fd.fcollectid 两条路径
        UNION ALL）；每 fpaycode 取 MAX(fenterdate)（round-03 q21 拍板"每笔缴款取最晚缴库日"，生命周期冗余被 MAX 吸收）；起点
        pay_date=缴款日（全局拍板1），终点 treasury_enter_date=fne_treasury_transfer_new.fenterdate（国库回执入库日）——与宽表
        enter_date（划转 MSG 到账日）同列名不同表，勿混用（round-03 q21 注记）；"今年缴款"按 pay_date 过滤；耗时用 enter_days，
        分档用 enter_duration_bucket（<1天/1-10天/10-100天/≥100天，全局拍板4）；2026 实测（今年缴款+有入库日 8 笔）分档：<1天 1/1-10天 1/10-100天 6
