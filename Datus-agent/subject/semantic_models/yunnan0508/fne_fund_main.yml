  - name: paybook_treasury_pair
    source: SELECT pay_code, MAX(pay_date) AS pay_date, MAX(treasury_enter_date) AS
      treasury_enter_date FROM (SELECT p.fpaycode AS pay_code, toDate(nullIf(p.fdate,
      '')) AS pay_date, toDate(nullIf(t.fenterdate, '')) AS treasury_enter_date FROM
      yunnan0508.fne_paybook_full_high p INNER JOIN yunnan0508.fne_funddivide_transfer
      fd ON fd.fpaybooksubid = p.fid INNER JOIN yunnan0508.fne_treasury_transfer_new
      t ON t.fpid = fd.fid UNION ALL SELECT p.fpaycode, toDate(nullIf(p.fdate, '')),
      toDate(nullIf(t.fenterdate, '')) FROM yunnan0508.fne_paybook_full_high p INNER
      JOIN yunnan0508.fne_funddivide_transfer fd ON fd.fpaybooksubid = p.fid INNER
      JOIN yunnan0508.fne_treasury_transfer_new t ON t.ftranscollectid = fd.fcollectid)
      GROUP BY pay_code
    description: 缴款→缴库配对数据集：缴款书宽表经 fpaybooksubid+ftranscollectid
      两跳关联缴库报文，聚合到 fpaycode 粒度，内置"有缴库记录"池
    ai_context:
      instructions: 数据集自包含（join+聚合在 source SQL 内），不与其他 dataset 建关系，无扇出；落点缘起：fne_treasury_transfer_new.fpaycode
        全空串（断供），无法直连宽表，必须经 funddivide_transfer 两跳链（t.fpid=fd.fid 与 t.ftranscollectid=fd.fcollectid 两条路径
        UNION ALL）；每 fpaycode 取 MAX(fenterdate)（每笔缴款取最晚缴库日，生命周期冗余被 MAX 吸收）；起点
        pay_date=缴款日，终点 treasury_enter_date=fne_treasury_transfer_new.fenterdate（国库回执入库日）——与宽表
        enter_date（划转 MSG 到账日）同列名不同表，勿混用；"今年缴款"按 pay_date 过滤；耗时用 enter_days，
        分档用 enter_duration_bucket（<1天/1-10天/10-100天/≥100天）
    fields:
    - name: pay_code
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: pay_code
      label: 票据关联码
      description: 缴款码（聚合键，每 fpaycode 一行），笔数口径 COUNT(DISTINCT pay_code)
      ai_context:
        synonyms:
        - 缴款码
    - name: pay_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: pay_date
      dimension:
        is_time: true
      label: 缴款日期
      description: 全程耗时起点=缴款日（宽表 fdate，源 FNE_PAYBOOK.FPAYDATE），本数据集主时间轴；"今年缴款"按本字段过滤
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
    - name: treasury_enter_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: treasury_enter_date
      dimension:
        is_time: true
      label: 缴库入库日期
      description: 全程耗时终点=每 fpaycode 最晚入库日（MAX(fenterdate)，fne_treasury_transfer_new 国库回执入库日）；
        与宽表 enter_date（划转 MSG 到账日）同列名不同表，勿混用；无入库日为 NULL
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
      ai_context:
        synonyms:
        - 入库日期
        - 缴入国库日期
    - name: enter_days
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: dateDiff('day', pay_date, treasury_enter_date)
      label: 全程耗时天数
      description: 缴款→缴库全程耗时天数（dateDiff(pay_date, treasury_enter_date) 口径）；无入库日为 NULL
        （落 enter_duration_bucket"未知"桶）
      datatype: Integer
    - name: enter_duration_bucket
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: multiIf(treasury_enter_date IS NULL, '未知', dateDiff('day', pay_date, treasury_enter_date) < 1, '<1天', dateDiff('day', pay_date, treasury_enter_date) < 10, '1-10天', dateDiff('day', pay_date, treasury_enter_date) < 100, '10-100天', '≥100天')
      label: 全程耗时区间分档
      description: 全程耗时区间分档维度（时长序列 1/10/100 天）：<1天/1-10天/10-100天/≥100天，无入库日落"未知"桶；
        分档内笔数口径 COUNT(DISTINCT pay_code)
      ai_context:
        synonyms:
        - 耗时分档
        - 全程耗时
    custom_extensions:
    - vendor_name: DATUS
      data: '{"source_type": "query", "time_dimension": "pay_date", "v": "1.11"}'
  - name: unpaid_paybook
    source: SELECT u.fpaycode AS pay_code, MAX(toDate(nullIf(u.fdate, ''))) AS issue_date,
      MAX(toDate(nullIf(u.feffdate, ''))) AS eff_date, MAX(u.ftotalamt) AS total_amt
      FROM yunnan0508.une_paybook_high u LEFT JOIN (SELECT DISTINCT fpaycode FROM
      yunnan0508.fne_paybook_full_high) f ON u.fpaycode = f.fpaycode WHERE coalesce(f.fpaycode,
      '') = '' AND u.fstate = '1' GROUP BY u.fpaycode
    description: 未缴缴款书池：UNE 开具侧（une_paybook_high）按 fpaycode 左连缴款书宽表无缴款记录+fstate='1'（官方统计主条件；frecmode_treasury 排除项断供，退化
      单条件并记断供），聚合到缴款书级
    ai_context:
      instructions: 数据集自包含（左连判定在 source SQL 内），不与其他 dataset 建关系；反连实现注意：CH 23.3 默认 join_use_nulls=0
        下 LEFT JOIN 未命中回填空串而非 NULL，故用 coalesce(f.fpaycode,'')='' 判未命中（两种 join_use_nulls 取值下均正确）——勿改写成
        IS NULL（改写成 IS NULL 会误得 0 行）；未缴判定=左连+行级 fstate='1'（UNE 侧状态 1=正常未缴/2=作废/3=已缴款确认/4=转电脑开票，InvoiceConsts.java:130-134；官方统计完整口径
        PayBook.xml:2464-2512 还含 fbillnature='2'+frecmode_treasury 排除项，后者断供退化单条件并记断供；票据性质排除项缺
        关联键（une 侧现无 fbillcode），补齐前维持单条件判定）；时间锚 issue_date=une_paybook_high.fdate（开具日，une 侧无
        ffilldate 列，锚 ffilldate 由本字段承载）——与宽表 fdate（缴款日，源 FNE_PAYBOOK.FPAYDATE）同名不同义
        （ffilldate 是 FNE 侧列名，未缴缴款书在 FNE 侧无记录）；
        有效期拆分：未缴且有效=eff_date>=当前日、已过期未缴=eff_date<当前日，
        两池互补勾稽等于未缴总数（eff_date 无空值）；分档用 unpaid_duration_bucket；金额 total_amt=ftotalamt 票面总额口径
        （含滞纳金存疑）
