  - name: dim_agen
    source: SELECT fagenidcode, fagencode, fagenname, flevel, ftypecode, fpidcode,
      toString(fisleaf) AS fisleaf FROM (SELECT fagenidcode, fagencode, fagenname,
      flevel, ftypecode, fpidcode, toString(fisleaf) AS fisleaf, ROW_NUMBER() OVER
      (PARTITION BY fagenidcode ORDER BY fupdatetime DESC) AS _rn FROM yunnan0508.fab_agen)
      WHERE _rn = 1
    description: 执收单位查询型维度：fab_agen 按 fagenidcode 去重取最新版本（fupdatetime DESC），295 行去重后
      218 行；含 parent_agen/is_leaf 单位树层级钻取字段
    ai_context:
      instructions: fab_agen 原始 295 行含多版本，直连会扇出约 4.4 倍，必须使用本去重数据集；与事实表的边（D5/D6/D7：fchgagenidcode=fagenidcode）实测验证连接，to
        侧去重后唯一；去重实现说明：规格原文为 ORDER BY fupdatetime DESC LIMIT 1 BY fagenidcode，因引擎查询源解析器不支持
        LIMIT 1 BY，已等价改写为 ROW_NUMBER() OVER (PARTITION BY fagenidcode ORDER BY fupdatetime
        DESC)=1（多列去重单排序列技巧），对账指纹一致（218 行）；parent_agen 指向表内 fagenidcode，可按 parent_agen=单位ID
        自联结汇总子单位缴款（注意 2 个单位存在跨版本父编码漂移，见 parent_agen 字段说明）
    fields:
    - name: fagenidcode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fagenidcode
      label: 单位ID
      description: 执收单位唯一编码（去重键），被各事实表 fchgagenidcode 引用
    - name: fagencode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fagencode
      label: 单位代码
    - name: fagenname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fagenname
      label: 单位名称
      description: 执收单位名称
      ai_context:
        synonyms:
        - 执收单位
        - 单位
    - name: flevel
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: flevel
      label: 单位层级
      description: 单位层级（数值，越小越靠上级）
      datatype: Integer
    - name: ftypecode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: ftypecode
      label: 单位类型代码
      description: 单位类型编码
    - name: parent_agen
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fpidcode
      label: 上级单位编码
      description: 上级单位编码（物理 fpidcode），String 型，沿 parent_agen=fagenidcode 自联结构成单位树。实测：fab_agen 原始
        295 行中 244 行有父编码、涉及 26 个不同父单位，全部指向表内有效 fagenidcode（无悬挂）；去重后 218 单位中 192 有父编码；2 个单位（18ff49716f334abf94e5405ef8911192、2a02256f21ae47a1bef24a7f99dbc352）跨版本父编码漂移（各
        2 个不同 fpidcode，同秒内两次变更），去重取 fupdatetime 最新版后树可能受影响；典型用法：JOIN 子查询沿 parent_agen 汇总（示例：测试云南省教育厅1
        直属 44 子单位、其中 43 叶子、10 个有直缴、直缴合计 160.47 亿）
      ai_context:
        synonyms:
        - 上级单位
        - 父单位
        - 主管单位
        - 单位树
    - name: is_leaf
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toString(fisleaf)
      label: 是否叶子单位
      description: 是否叶子单位（物理 fisleaf 为 UInt8，toString 转字符串），String 型取值 ''0''/''1''，过滤值必须带引号。实测（去重后 218
        行）：''0''=26 非叶、''1''=192 叶；层级×叶标志分布 1级（20非叶+23叶）/2级（6非叶+159叶）/3级（10叶）。用途：层级聚合时只对 is_leaf=''1''
        的叶子单位汇总防父子双重计数；注意 1 级也有 23 个叶子单位——顶层直属单位可直接挂缴款
      ai_context:
        synonyms:
        - 叶子
        - 末级单位
        - 单位叶子
