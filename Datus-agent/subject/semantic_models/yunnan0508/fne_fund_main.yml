        fpayBookEffDays 天、否则 2099-12-31，InvoiceHelper.java:274-287；无过期定时任务，过期判定纯靠本字段与当前日期比较
        OpenQueryAPIServiceImpl.java:615）；有效期拆分锚：未缴且有效=本字段>=当前日，已过期未缴=本字段
