        落地列名 fisenter/源侧 fiseenter）；滞留天数用 transit_days，分档用 transit_duration_bucket；金额列落地为 ftransamt（源侧拍板记 FAMT）
    custom_extensions:
    - vendor_name: DATUS
      data: '{"v":"1.11","dataset":"transfer_new","time_dimension":"transfer_new.transdate","subject_path":["非税收入","资金链","划拨"],"unit":"元","uid":"r02q24intransitamt000001"}'
  - name: 在途滞留笔数
    description: 在途滞留笔数（指令已发未到账：fistransfer='1' 且 fisenter='0'，按 ftransno 去重，round-02 q24 拍板辅指标）；实测 27 个 ftransno
    expression:
      dialects:
      - dialect: CLICKHOUSE
        expression: COUNT(DISTINCT CASE WHEN transfer_new.fistransfer = '1' AND transfer_new.enter_flag = '0' THEN transfer_new.ftransno END)
    ai_context:
      instructions: 在途滞留池辅指标（数据集 transfer_new，round-02 q24）；口径与 在途滞留金额 完全一致（ftransstats/ftransdate 落地限制
        同该指标说明）；ftransno 生命周期多版本，必须去重计数；滞留天数用 transit_days，分档用 transit_duration_bucket
    custom_extensions:
    - vendor_name: DATUS
      data: '{"v":"1.11","dataset":"transfer_new","time_dimension":"transfer_new.transdate","subject_path":["非税收入","资金链","划拨"],"unit":"笔","uid":"r02q24intransitcnt000001"}'
  - name: 清分率
    description: 清分率 = 清分金额 ÷ 非税缴款金额（两者同在 paybook_full_high 行内）；按 fbustype
      分组时比值逐组成立；整体比值含全类型行，直缴清分率=查询时分子分母同时过滤 fbustype='1'
    datatype: Float
    expression:
      dialects:
      - dialect: CLICKHOUSE
        expression: COALESCE(SUM(paybook_full_high.fimamt), 0) / COALESCE(SUM(paybook_full_high.famt),
          0)
    ai_context:
      instructions: compose 派生：清分金额 / 非税缴款金额，两者同 dataset 行内计算安全；除零/空值按 fill=0 返回
        0；直缴口径必须同时过滤 fbustype='1'，禁止只用全类型合计表述直缴清分率
    custom_extensions:
    - vendor_name: DATUS
      data: '{"v":"1.11","derive":{"type":"compose","expr":"清分金额 / 非税缴款金额","fill":0},"dataset":"paybook_full_high","time_dimension":"paybook_full_high.pay_date","subject_path":["非税收入","资金链","清分"],"uid":"vu089fiu5h16kcr6xm19suzo"}'
