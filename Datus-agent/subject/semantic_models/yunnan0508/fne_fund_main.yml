  - name: paybook_head
    source: SELECT fpaycode AS pay_code, any(ftotalamt) AS total_amt, SUM(famt) AS
      item_amt, any(fisreceived) AS is_received, any(toDate(nullIf(fdate, ''))) AS
      pay_date, any(fbustype) AS bustype, any(fpaybankcode) AS pay_bank_code, any(fpaybankname)
      AS pay_bank_name, any(frecbankname) AS rec_bank_name FROM yunnan0508.fne_paybook_full_high
      GROUP BY fpaycode
    description: 缴款书粒度数据集（票面总额口径），自明细行宽表 fne_paybook_full_high 按 fpaycode 升粒度，每张缴款书恰一行；书级数值本粒度直 SUM：total_amt=票面总额、item_amt=该书明细金额合计
