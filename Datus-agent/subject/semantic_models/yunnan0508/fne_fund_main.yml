  - name: no_income_paybook
    source: SELECT p.fpaycode AS pay_code, MAX(toDate(nullIf(p.fdate, ''))) AS pay_date
      FROM yunnan0508.fne_paybook_full_high p LEFT JOIN (SELECT DISTINCT fpaycode
      FROM yunnan0508.fne_income_daybook) d ON p.fpaycode = d.fpaycode WHERE p.fisreceived
      = '1' AND coalesce(d.fpaycode, '') = '' GROUP BY p.fpaycode
    description: 已缴款未形成收入记录池：宽表 fisreceived='1' 按 fpaycode 左连收入台账
      distinct fpaycode 无匹配记录（记录口径 CK 落地退化——权威判定 FNE_PAYINFO_RECONCILED.FUNGENEINCOMEAMT>0 整表未抽取
      ，按契约"断供只记账不改口径"以台账关联无记录退化）
