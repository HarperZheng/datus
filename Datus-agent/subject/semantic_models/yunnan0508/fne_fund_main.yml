  - name: transit_transfer_pool
    source: SELECT DISTINCT ftransno AS trans_no, fpaycode AS pay_code, ftransamt AS
      trans_amt, toDate(nullIf(ftransdate, '')) AS trans_date FROM yunnan0508.fne_paybook_full_high
      WHERE fistransfer = '1' AND (fisenter = '0' OR toDate(nullIf(fenterdate, '')) IS NULL)
    description: 划拨在途滞留池：宽表"指令已发未到账"行去重到（划拨单号×缴款书）粒度（ftransamt 批次级回填，raw 明细行直接 SUM 会虚增，须去重）
    ai_context:
      instructions: 数据集自包含（池过滤在 source SQL 内），不与其他 dataset 建关系；池条件=fistransfer='1'
        AND (fisenter='0' OR fenterdate IS NULL)，已内置；源侧完整判据 fstats='9' AND fisenter='0'（CapitalTransfer.xml:9）
        因宽表实库无 fstats 列（ETL 抽取未带出）退化为 fistransfer+'0'/'1' 判定，fistransfer 源侧由
        DECODE(NVL(MSG.FSTATS,'0'),'0','0','1') 派生，无法排除 fstats='7' 划转失败，记数据现实偏差；
        单头表 FNE_TRANSFER_BANK_MSG 未抽取，金额取宽表 ftransamt（源 FNE_COLLECT_TO_TRANSFER.FAMT）；
        粒度缘起：ftransamt 为批次级回填，同 ftransno 多明细行重复同额，
        raw SUM 虚高，须去重到（ftransno,fpaycode）；笔数口径 COUNT(DISTINCT trans_no)
        （划拨单据号）；时间锚 trans_date=ftransdate（银行回执成功日写入，RestTransferService.java:279-291；
        "下达"无独立日期字段，以此为最接近可用锚）；滞留天数用
        transit_days，分档用 transit_duration_bucket
    fields:
    - name: trans_no
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: trans_no
      label: 划拨单据号
      description: 划拨阶段单据号（物理 ftransno，源 FNE_COLLECT_TO_TRANSFER.FTRANSFERNO，笔数键）；
        与缴库侧单据号（fenterno 等）同名陷阱勿混
      ai_context:
        synonyms:
        - 划拨单号
    - name: pay_code
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: pay_code
      label: 票据关联码
      description: 缴款码（去重键之一：每（ftransno,fpaycode）一行）
      ai_context:
        synonyms:
        - 缴款码
    - name: trans_amt
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: trans_amt
      label: 划拨金额
      description: 该（划拨单×缴款书）的划拨金额（物理 ftransamt，源 FNE_COLLECT_TO_TRANSFER.FAMT，Nullable(Decimal(18,6))）；
        去重后 SUM 即在途滞留金额（raw 明细行粒度 SUM 会因批次级回填重复而虚增）
      datatype: Decimal
    - name: trans_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: trans_date
      dimension:
        is_time: true
      label: 划转日期
      description: 滞留起算锚=ftransdate（银行回执成功日写入，RestTransferService.java:279-291；语义≈划转执行/回执日，
        "下达"无独立日期字段，以此为最接近可用锚）；本数据集主时间轴
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
    - name: transit_days
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: dateDiff('day', trans_date, today())
      label: 在途滞留天数
      description: 划拨指令滞留天数（当前日−trans_date）；trans_date 为空（未回执）为 NULL
      datatype: Integer
    - name: transit_duration_bucket
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: multiIf(trans_date IS NULL, '未知', dateDiff('day', trans_date, today()) < 1, '<1天', dateDiff('day', trans_date, today()) < 10, '1-10天', dateDiff('day', trans_date, today()) < 100, '10-100天', '≥100天')
      label: 在途滞留时长分档
      description: 在途滞留时长分档维度（时长序列 1/10/100 天）：<1天/1-10天/10-100天/≥100天，trans_date
        为空落"未知"桶；分档内笔数口径 COUNT(DISTINCT trans_no)
      ai_context:
        synonyms:
        - 滞留时长
        - 在途分档
    custom_extensions:
    - vendor_name: DATUS
      data: '{"source_type": "query", "time_dimension": "trans_date", "v": "1.11"}'
  - name: income_daybook
    source: yunnan0508.fne_income_daybook
    description: 收入流水表：执收单位已收资金流水（按 freceiveddate 日刷分区），fisgenerec=0
      为"已收未汇缴"存量池；收入侧口径含 enter_date 记账日期锚、income_agen_name/bgt_agen_name/dept_name/subject_name/income_rgn_name
