        收入侧口径："收入金额/收入单位/预算科目/收入区划/预算单位/主管部门"类问题一律用本数据集，
        收入侧"今年"按 enter_date（收入日期锚）过滤，received_date（到账锚）保留给已收未汇缴滞留口径；财政记账完成判定走缴库报文侧
