version: 0.2.0.dev0
semantic_model:
- name: fne_fund_main
  description: 非税收入资金链（缴款→清分→划拨→缴库）：核心骨架（paybook_full_high_item / funddivide_transfer /
    treasury_transfer_dedup）+ 同主题补充（transfer_new / agen_treasury_high）+ 查询型数据集（paybook_treasury_pair
    缴款-缴库配对 / unpaid_paybook 未缴池 / transit_transfer_pool 划拨在途池 / income_daybook 收入流水 /
    no_income_paybook 已缴未形成收入池 / entered_uncleared_paybook 已缴库未清分池 / paybook_head 缴款书粒度票面总额）+
    查询型维度（dim_agen / dim_subject）；查询型数据集自包含不建关系
  ai_context:
    instructions: 金额指标一律锚定单 dataset（跨边求和会因 M:N 扇出膨胀）；to 侧非唯一的关系仅授权行级钻取用途；fbustype（业务类型：1=直缴、2=汇缴）仅存在于 paybook_full_high_item
      数据集，仅缴款/清分/清分率类指标可按业务类型切片，禁止对其他 dataset（funddivide_transfer / treasury_transfer_dedup
      / transfer_new / agen_treasury_high）的指标按业务类型分组或过滤；滞留类两池分家："执收单位已收未汇缴"
      用 income_daybook 的 已收未汇缴金额（fisgenerec=0），"划拨指令已发未到账/在途滞留"用 transit_transfer_pool 的 在途滞留金额/在途滞留笔数，两池禁止混用；
      收入侧问题（收入单位/预算科目/收入区划/预算单位/主管部门口径）一律走
      income_daybook（收入金额 + income_agen_name/subject_name/income_rgn_name/bgt_agen_name/dept_name 维度、enter_date 收入锚），与缴款侧
      paybook_full_high_item 口径分家，禁止用缴款侧字段冒充收入侧口径；"对账"一词三义——资金对账=fisfundsrec/ffundsrecdate、
      缴库报文对账=treasury_transfer_dedup.reconcile_status、清分=is_cleared，禁止互相顶替；退付域未建模缺口：
      UNE_REFUND/FNE_BACKPAY/FNE_REFUND_DATA/FNE_REFUND/FNE_REFUND_RECEIPT 五表全未抽取，"退付金额/退付给缴款人"类问题
      显式拒答并说明待扩抽取，不得以 0 作答
  datasets:
  - name: paybook_full_high_item
    source: yunnan0508.fne_paybook_full_high
    description: 缴款书全生命周期明细行宽表（缴款+清分事实，PAYBOOK+ITEM+状态），一张缴款书拆多明细行；行级金额本粒度直 SUM：famt=缴款明细金额、fimamt=清分金额
    ai_context:
      instructions: 分析缴款/清分/归属/科目/项目层级用；金额可直 SUM，笔数键统一 COUNT(DISTINCT fpaycode)（fid 有生命周期多版本重复、
        fpaycode 因明细拆多行亦非唯一，两者计数都必须去重）；主时间轴 pay_date=toDate(nullIf(fdate,''))（缴款日，day 粒度；缴款时间统一 FDATE，
        toDate 精度不带时分秒；fill_date 为开票口径分析维度）；与汇缴（une_）口径不混算；本表 fid 被 funddivide_transfer.fpaybooksubid
        引用；fbustype：1=直缴、2=汇缴，表内混合存在；凡用户提及"直缴"必须按
        fbustype='1' 收窄，禁止将全表 SUM(famt) 表述为直缴金额；日期维度体系：除主时间轴 pay_date 外已建模日期维度（开票日 fill_date、
        有效期 eff_date、资金到账 received_date、划转 trans_date、划拨到账 enter_date），仅作分析维度；"缴款/今年缴款"类问题一律按主时间轴
        pay_date 过滤，开票口径需显式改用 fill_date（差异见字段说明）；"已缴"判定=行在本表存在即 FNE
        侧有缴款记录（UNE 侧左连判定），金额分档统计用 amount_bucket × 有效缴款笔数；"各代理银行代收/排名"类问题=指标 代收非税收入金额（锚定缴款书粒度数据集 paybook_head）；本数据集 pay_bank_code/pay_bank_name
        服务明细行口径金额按代理银行分组；清分"分入"核心模式=两区划/两单位字段参与判定：分入本区划=frecrgncode=本区划 AND
        fchgrgncode≠frecrgncode、分入本单位=rec_agen_id_code=本单位（分入金额一律=fimamt，禁用 ftransamt 划拨金额；
        "分入本区划"过滤=frecrgncode=本区划）；资金去向=bgt_style_code（1=国库/2=财政专户/3=单位代收/4=其他，
        分组维度，禁用资金性质 funds_nature——那是更细预算级次）；到账时效起 pay_date 终 received_date，对账完成=
        funds_rec_flag/funds_rec_date（资金对账），与缴库报文对账（treasury_transfer_dedup.reconcile_status）、清分（is_cleared）三义勿混
    fields:
    - name: fid
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fid
      label: 缴款明细ID
      description: 缴款明细生命周期ID；存在生命周期多版本重复，非唯一键；笔数口径统一走 fpaycode（见
        pay_code 字段），本字段仅作行标识
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","is_dimension":false}'
    - name: fpid
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fpid
      label: 缴款主单ID
      description: 缴款通知书主单ID，同主单可有多明细行
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","is_dimension":false}'
    - name: famt
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: famt
      label: 缴款金额
      description: 缴款通知书明细金额（元）
      datatype: Decimal
    - name: fimamt
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fimamt
      label: 清分金额
      description: 该明细行已清分金额（元）
      datatype: Decimal
    - name: fill_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(ffilldate)
      dimension:
        is_time: true
      label: 缴款通知书填开日
      description: 缴款通知书填开日期（ffilldate 字符串转 Date），开票口径分析维度；主时间轴为
        pay_date（缴款日），"按开票日"类问题显式使用本字段
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
    - name: fchgagenidcode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fchgagenidcode
      label: 执收单位ID
      description: 执收单位唯一编码，连接 dim_agen.fagenidcode
    - name: fchgagenname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fchgagenname
      label: 执收单位名称
      description: 执收单位名称（内联）
      ai_context:
        synonyms:
        - 执收单位
    - name: fchgrgncode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fchgrgncode
      label: 执收单位区划代码
      description: 执收单位所在区划代码
    - name: fchgrgnname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fchgrgnname
      label: 执收区划名称
      description: 执收单位所在区划名称（内联），String 型；与 fchgrgncode 一一对应，分组展示优先用本列；与归属区划 frecrgnname 大量不一致（区划间资金流入口径的近似基础；注意
        frecrgnname 含空串与"中央"等特殊值，跨区归因口径需业务确认）
      ai_context:
        synonyms:
        - 执收区划
    - name: frecrgnname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: frecrgnname
      label: 归属区划名称
      description: 资金归属区划名称（内联，州市/区县）
      ai_context:
        synonyms:
        - 州市
        - 区县
        - 区划
    - name: frecrgncode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: frecrgncode
      label: 归属区划代码
      description: 资金归属区划代码，String 型；值域：530000=云南省本级、''（空）=清分汇总前中间态、000000=中央、530100=昆明市本级、532929=云龙县、530102=五华区；「本区划」过滤取值=登录人所属区划，本库主体区划为云南省本级
        530000；分组展示配 frecrgnname
    - name: frecbankname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: frecbankname
      label: 收款银行名称
      description: 缴款资金收款银行名称（收款户开户侧，内联），String 型；取值统一带尾部空格，过滤匹配需 trim；值域含：中国建设银行/中国工商银行/中国银行/人民银行/中国邮政储蓄银行/中国农业银行/云南省农村信用社联合社/支付宝/中国光大银行；分组仅限收款银行视角
      ai_context:
        synonyms:
        - 收款银行
    - name: fsubcode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fsubcode
      label: 科目代码
      description: 预算科目代码，连接 dim_subject.fsubcode
    - name: fsubname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fsubname
      label: 科目名称
      description: 预算科目名称（内联）
    - name: fitemidcode
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fitemidcode
      label: 项目ID
      description: 非税收入项目ID
    - name: fitemname
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fitemname
      label: 项目名称
      description: 非税收入项目名称（内联）
    - name: fcollectid
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fcollectid
      label: 汇总批次ID
      description: 清分汇总批次ID；空串表示尚未入批次
    - name: fistransfer
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fistransfer
      label: 划拨标志
      description: 是否已划拨（String 型，过滤值必须带引号）：1=已划拨；值域含 ''（空）、'0'（''与'0'均未划拨）、'1'；未划拨池=''或'0'
    - name: fstate
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fstate
      label: 缴款书状态
      description: 缴款书生命周期状态，String 型，过滤值必须带引号；码值枚举（源码 UPayBook.xml：1=未缴款、2=作废、3=已缴款、4=已到账）；
        值域含 '3' 与 ''（空），过滤时保留空串与其他码值的可能性；
        本字段在宽表的可用过滤=有效缴款 fstate≠'2'（本表 FSTATE 不在 insert 列清单、值来自 UNE 侧状态，仅作废排除可靠）
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","is_dimension":false}'
      ai_context:
        synonyms:
        - 缴款状态
        - 作废
        - 已缴款
    - name: fbustype
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fbustype
      label: 业务类型
      description: 缴款业务类型：1=直缴，2=汇缴（集中汇缴，fne_ 表内混合存在）；String 型，
        过滤值必须带引号；用户问"直缴/汇缴"必须按本字段切片或过滤，禁止把全表 SUM 当直缴
      ai_context:
        synonyms:
        - 业务类型
        - 缴款方式
        - 直缴
        - 汇缴
    - name: funds_nature
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high_item.ffundsnaturecode
      label: 资金性质
      description: 资金性质（预算级次）码，String 型，过滤值必须带引号；100% 非空；码值：12=政府性基金预算收入、11=一般公共预算收入、2=财政专户管理资金、5=其他；与 funddivide_transfer.funds_nature（frecfundsnaturecode）同码表
      ai_context:
        synonyms:
        - 资金性质
        - 预算级次
        - 基金
        - 一般公共预算
    - name: funds_nature_name
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high_item.ffundsnaturename
      label: 资金性质名称
      description: 资金性质中文名称（内联展示列），与 funds_nature（ffundsnaturecode）一一对应，取值：政府性基金预算收入/一般公共预算收入/财政专户管理资金/其他；分组展示优先用本列，过滤按码列
        funds_nature
    - name: rec_funds_nature
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: frecfundsnaturecode
      label: 接收侧资金性质
      description: 接收侧（清分落账侧）资金性质码（物理 frecfundsnaturecode，String 型，过滤值必须带引号；语义对应源侧资金分类 FFUNDSORT）；
        值域：12=政府性基金预算收入、2=财政专户管理资金、11=一般公共预算收入、5=其他、''（空）=未清分中间态；与缴款侧 funds_nature（ffundsnaturecode）同码表；
        资金性质错配判定列（应缴国库性质 11-14 实落专户，见 资金性质错配笔数 指标）
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","is_dimension":false}'
      ai_context:
        synonyms:
        - 接收侧资金性质
        - 落账资金性质
    - name: income_sort
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high_item.fincomesortname
      label: 收入分类
      description: 收入分类名称（单列即名称，无配套码列）；值域含 政府性基金收入/专项收入/行政事业性收费收入/罚没收入 及空值
      ai_context:
        synonyms:
        - 收入分类
        - 收入类别
        - 罚没
        - 专项收入
    - name: pay_code
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high_item.fpaycode
      label: 票据关联码
      description: 财政票据关联码（缴款码），String 型；100% 非空；票据链（une_cbill_high.fpaycode）与资金链之间唯一验证连通的键（单据键 fpid
        跨链无命中，不用于跨链）；全部缴款类笔数指标（缴款/完成/未缴/分档）统一以本字段去重计数；为
        fne_bill_link.yml 票据-资金桥接模型预铺桥键，本文件内不声明关系
      ai_context:
        synonyms:
        - 票据关联
        - 缴款码
    - name: payer_name
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high_item.fpayername
      label: 缴款人（付款方）
      description: 缴款人/付款方名称（内联），String 型；存在含"测试"字样的测试数据单位（数据污染），排名类结果需业务甄别；缴款人排名类问题（如 Top10 缴款人）按本列分组；账号类字段
        fpayerno/fpayerid 不建模
      ai_context:
        synonyms:
        - 缴款人
        - 付款方
        - 缴款单位
        - 缴款人名称
    - name: is_cleared
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high_item.fisclear
      label: 是否清分
      description: 是否已清分标志（物理 fisclear 为 Nullable(UInt32)，值域仅 0/1 无 NULL）：1=已清分、0=未清分；清分环节判定字段
      datatype: Integer
      ai_context:
        synonyms:
        - 清分状态
        - 已清分
        - 未清分
    - name: is_received
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: paybook_full_high_item.fisreceived
      label: 资金是否到账
      description: 资金是否到账标志（物理 fisreceived 为 Nullable(UInt32)，值域仅 0/1 无 NULL）：1=已到账、0=未到账（0 含"已缴款未到账"中间态）；
        到账环节标志（比缴款晚一环，源码 UPayBook.xml）；"已到账/未到账"过滤（明细行口径）用本字段
      datatype: Integer
      ai_context:
        synonyms:
        - 到账状态
        - 已到账
        - 未到账
    - name: clear_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(nullIf(paybook_full_high_item.fcleardate, ''))
      dimension:
        is_time: true
      label: 清分日期
      description: 清分日期（fcleardate 字符串转 Date，nullIf 空串守卫——空串直接 toDate 在 CH 23.3 抛 CANNOT_PARSE_DATE），本表二级时间轴
        （主时间轴为 pay_date，清分日期双侧时间轴对齐）；未清分行此值为 NULL；清分时效分析用（clear_date -
        fill_date 间隔）
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
    - name: eff_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(nullIf(paybook_full_high_item.feffdate, ''))
      dimension:
        is_time: true
      label: 缴款书有效期
      description: 缴款书有效期（feffdate 字符串转 Date，nullIf 空串守卫），NOT NULL；可含未来日期（有效期天然可晚于当前）；判断已过期按本字段与当前日期比较，不能当业务发生时间轴用
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day","is_dimension":false}'
      ai_context:
        synonyms:
        - 有效期
    - name: pay_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(nullIf(paybook_full_high_item.fdate, ''))
      dimension:
        is_time: true
      label: 缴款日期
      description: 缴款书缴款日期（fdate 字符串转 Date，nullIf 空串守卫），本表主时间轴（缴款时间统一 FDATE，
        toDate 精度不带时分秒），NOT NULL；与开票日 fill_date 基本同日、少量晚于开票日——"缴款/今年缴款"类问题一律按本字段过滤/分组，开票口径需显式改用 fill_date；源侧 fdate 另承载生成日期义，
        本表主语义取缴款日期；源侧设计的缴款日期列 fpaydate 在本物理表不存在，无法建模
      datatype: Date
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","time_granularity":"day"}'
      ai_context:
        synonyms:
        - 缴款日
    - name: received_date
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: toDate(nullIf(paybook_full_high_item.freceiveddate, ''))
      dimension:
        is_time: true
      label: 资金到账日期
      description: 缴款资金到账日期（freceiveddate 字符串转 Date，nullIf 空串守卫），与 is_received（fisreceived）标志配套，
        两者存在轻微错位——到账口径过滤以 is_received 为准，本字段用于到账时效（received_date 与 fill_date/pay_date 的间隔）；
        与 enter_date（划拨侧到账）是两条不同资金链，勿混用
      datatype: Date
      custom_extensions:
