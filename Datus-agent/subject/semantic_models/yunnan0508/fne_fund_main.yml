      instructions: 数据集自包含（反连判定在 source SQL 内），不与其他 dataset 建关系；反连实现：CH 23.3 默认 join_use_nulls=0
        下 LEFT JOIN 未命中回填空串，用 coalesce(d.fpaycode,'')='' 判无收入记录（勿改写 IS NULL）；台账侧取 DISTINCT fpaycode
        防一对多扇出（report.sql:57 先例）；口径两义辨析：记录口径=本池笔数，金额差额口径（FUNGENEINCOMEAMT 权威，
        未抽取断供）两口径不可互推，金额差额备选=fownimamt；"今年已缴款"按 pay_date 过滤；
        已缴款判定=fisreceived='1'，勿用宽表 fstate
