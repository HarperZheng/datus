    - name: fid
      expression:
        dialects:
        - dialect: CLICKHOUSE
          expression: fid
      label: 缴库明细ID
      description: 缴库报文明细ID，本数据集已按其去重（去重后唯一）
      custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.11","is_dimension":false}'
