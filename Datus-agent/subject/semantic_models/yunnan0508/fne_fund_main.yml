  - name: 清分率
    description: 清分率 = 清分金额 ÷ 非税缴款金额（两者同在 paybook_full_high 行内）；按 fbustype
      分组时比值逐组成立；整体比值含全类型行，直缴清分率=查询时分子分母同时过滤 fbustype='1'
    datatype: Float
    expression:
      dialects:
      - dialect: CLICKHOUSE
        expression: COALESCE(SUM(paybook_full_high.fimamt), 0) / COALESCE(SUM(paybook_full_high.famt),
          0)
    ai_context:
      instructions: compose 派生：清分金额 / 非税缴款金额，两者同 dataset 行内计算安全；除零/空值按 fill=0 返回
        0；直缴口径必须同时过滤 fbustype='1'，禁止只用全类型合计表述直缴清分率
    custom_extensions:
    - vendor_name: DATUS
      data: '{"v":"1.11","derive":{"type":"compose","expr":"清分金额 / 非税缴款金额","fill":0},"dataset":"paybook_full_high","time_dimension":"paybook_full_high.fill_date","subject_path":["非税收入","资金链","清分"],"uid":"vu089fiu5h16kcr6xm19suzo"}'
